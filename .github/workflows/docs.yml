name: docs-validation
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full suite: Sunday 06:00 Israel time (04:00 UTC, winter offset).
    - cron: '0 4 * * 0'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate design guardrails
        run: python3 scripts/validate_docs.py
      - name: Test validator with synthetic documents
        run: python3 -m unittest discover -s tests -v

  summary:
    permissions:
      contents: read
    name: Run summary
    if: always()
    needs: [docs]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
