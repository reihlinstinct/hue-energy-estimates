name: docs-validation
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full suite: Sunday 06:00 Israel time (04:00 UTC, winter offset).
    - cron: '0 4 * * 0'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate design guardrails
        run: python3 scripts/validate_docs.py
      - name: Test validator with synthetic documents
        run: python3 -m unittest discover -s tests -v

  alert:
    # Scheduled-run failure opens (or throttled-updates) one alert issue (#25).
    needs: [docs]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - name: Open or update the single alert issue (at most one comment per 24 hours)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          [ "$GITHUB_REPOSITORY" = "reihlinstinct/hue-energy-estimates" ]
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          call() { printf 'header = "Authorization: Bearer %s"\nheader = "Accept: application/vnd.github+json"\n' "$GH_TOKEN" | curl -fsS -K - "$@"; }
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          num=$(call "$api/issues?state=open&labels=docs-validation-alert&per_page=1" | jq -r '.[0].number // empty')
          if [ -z "$num" ]; then
            call -X POST "$api/issues" -d "$(jq -n --arg b "The weekly docs-validation run failed: $run" '{title:"docs-validation weekly run failed",body:$b,labels:["docs-validation-alert"]}')" >/dev/null
          else
            last=$(call "$api/issues/$num/comments?per_page=100" | jq -r 'if length>0 then .[-1].created_at else empty end')
            [ -z "$last" ] && last=$(call "$api/issues/$num" | jq -r .created_at)
            age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
            if [ "$age" -ge 86400 ]; then
              call -X POST "$api/issues/$num/comments" -d "$(jq -n --arg b "Still failing: $run" '{body:$b}')" >/dev/null
            fi
          fi

  summary:
    permissions:
      contents: read
    name: Run summary
    if: always()
    needs: [docs]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
