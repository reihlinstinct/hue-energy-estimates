name: docs-validation
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full suite: Sunday 06:00 Israel time (04:00 UTC, winter offset).
    - cron: '0 4 * * 0'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate design guardrails
        run: python3 scripts/validate_docs.py
      - name: Test validator with synthetic documents
        run: python3 -m unittest discover -s tests -v

  weekly-failure-issue:
    name: Weekly failure issue
    # Opens (or updates a single open) issue when the scheduled weekly run
    # fails. The docs job runs with the read-only token; only this job gets
    # issues: write.
    if: ${{ github.event_name == 'schedule' && failure() }}
    needs: [docs]
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: Open or update one failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --state open --search 'Weekly CI failure in:title' --json number --jq '.[0].number // ""')
          body="The scheduled weekly docs-validation suite failed: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Weekly CI failure ($(date +%Y-%m-%d))" --body "$body"
          fi

  summary:
    permissions:
      contents: read
    name: Run summary
    if: always()
    needs: [docs]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
